<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Chart AI Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center py-4">
            <h1 class="text-xl font-bold">FX Chart AI Analyzer</h1>
            <p class="text-xs text-slate-400">スマホ対応AIチャート分析</p>
        </header>

        <div class="bg-slate-800 p-4 rounded-xl shadow space-y-3">
            <label class="block text-sm font-medium">チャート画像をアップロード</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-600 file:text-white hover:file:bg-violet-700"/>
            
            <div id="previewContainer" class="hidden">
                <img id="imagePreview" class="w-full h-48 object-cover rounded-lg border border-slate-700" alt="プレビュー">
            </div>

            <button id="analyzeBtn" class="w-full bg-violet-600 hover:bg-violet-700 font-bold py-2 px-4 rounded-lg transition">
                AIでチャートを分析する
            </button>
        </div>

        <div id="resultContainer" class="bg-slate-800 p-4 rounded-xl shadow hidden">
            <h2 class="font-bold text-violet-400 mb-2">分析結果</h2>
            <div id="resultText" class="text-sm whitespace-pre-wrap text-slate-200"></div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        const apiKey = localStorage.getItem("gemini_api_key") || prompt("Gemini APIキーを入力してください:");
        if (apiKey) {
            localStorage.setItem("gemini_api_key", apiKey);
        }

        const ai = new GoogleGenAI({ apiKey: apiKey });
        let base64Image = null;

        document.getElementById("imageInput").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (uploadEvent) => {
                base64Image = uploadEvent.target.result.split(",")[1];
                const preview = document.getElementById("imagePreview");
                preview.src = uploadEvent.target.result;
                document.getElementById("previewContainer").classList.remove("hidden");
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("analyzeBtn").addEventListener("click", async () => {
            if (!base64Image) {
                alert("チャート画像を選択してください。");
                return;
            }

            const resultContainer = document.getElementById("resultContainer");
            const resultText = document.getElementById("resultText");
            resultContainer.classList.remove("hidden");
            resultText.textContent = "分析中...";

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: [
                        {
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64Image
                            }
                        },
                        {
                            text: "このFXチャートを分析し、トレンドの方向性、サポート・レジスタンスライン、およびエントリーの優位性についてプロのトレーダーの視点で解説してください。"
                        }
                    ]
                });

                resultText.textContent = response.text;
            } catch (error) {
                resultText.textContent = "エラーが発生しました: " + error.message;
            }
        });
    </script>
</body>
</html>
