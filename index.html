<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Chart AI Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center py-4">
            <h1 class="text-xl font-bold">FX Chart AI Analyzer</h1>
            <p class="text-xs text-slate-400">スマホ対応AIチャート分析</p>
        </header>

        <div class="bg-slate-800 p-4 rounded-xl shadow space-y-3">
            <div>
                <label class="block text-sm font-medium mb-1">Gemini APIキー</label>
                <input type="password" id="apiKeyInput" placeholder="APIキーを入力して保存" class="w-full text-sm bg-slate-700 border border-slate-600 rounded-lg p-2 text-white"/>
                <button id="saveKeyBtn" class="mt-2 w-full bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded-lg transition">APIキーを保存</button>
            </div>

            <hr class="border-slate-700">

            <label class="block text-sm font-medium">チャート画像をアップロード</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-600 file:text-white hover:file:bg-violet-700"/>
            
            <div id="previewContainer" class="hidden">
                <img id="imagePreview" class="w-full h-48 object-cover rounded-lg border border-slate-700" alt="プレビュー">
            </div>

            <button id="analyzeBtn" class="w-full bg-violet-600 hover:bg-violet-700 font-bold py-2 px-4 rounded-lg transition">
                AIでチャートを分析する
            </button>
        </div>

        <div id="resultContainer" class="bg-slate-800 p-4 rounded-xl shadow hidden">
            <h2 class="font-bold text-violet-400 mb-2">分析結果</h2>
            <div id="resultText" class="text-sm whitespace-pre-wrap text-slate-200"></div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai@0.1.1";

        const apiKeyInput = document.getElementById("apiKeyInput");
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        document.getElementById("saveKeyBtn").addEventListener("click", () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                alert("APIキーを保存しました！");
            } else {
                alert("APIキーを入力してください。");
            }
        });

        let base64Image = null;
        let mimeType = "image/jpeg";

        document.getElementById("imageInput").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            mimeType = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = (uploadEvent) => {
                const result = uploadEvent.target.result;
                base64Image = result.split(",")[1];
                const preview = document.getElementById("imagePreview");
                preview.src = result;
                document.getElementById("previewContainer").classList.remove("hidden");
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("analyzeBtn").addEventListener("click", async () => {
            const currentApiKey = localStorage.getItem("gemini_api_key") || apiKeyInput.value.trim();
            const resultContainer = document.getElementById("resultContainer");
            const resultText = document.getElementById("resultText");
            resultContainer.classList.remove("hidden");

            if (!currentApiKey) {
                resultText.textContent = "エラー: APIキーを入力し、「APIキーを保存」を押してください。";
                return;
            }
            if (!base64Image) {
                resultText.textContent = "エラー: チャート画像を選択してください。";
                return;
            }

            resultText.textContent = "AIにリクエスト送信中...";

            try {
                const ai = new GoogleGenAI({ apiKey: currentApiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: [
                        {
                            inlineData: {
                                mimeType: mimeType,
                                data: base64Image
                            }
                        },
                        {
                            text: "このFXチャートを分析し、トレンドの方向性、サポート・レジスタンスライン、およびエントリーの優位性についてプロのトレーダーの視点で解説してください。"
                        }
                    ]
                });

                resultText.textContent = response.text;
            } catch (error) {
                resultText.textContent = "通信エラー: " + (error.message || JSON.stringify(error));
            }
        });
    </script>
</body>
</html>
